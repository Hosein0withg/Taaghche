<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طاقچه</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <h1 class="logo">طاقچه</h1>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="جستجو در عنوان و نویسنده...">
            </div>
            <nav class="header-nav">
                <a href="#" id="categories-link">دسته‌ها</a>
                <a href="#" id="library-link">کتابخانه من</a>
                <button id="auth-button" class="btn-primary">ورود / ثبت‌نام</button>
            </nav>
        </div>
    </header>

    <main id="app">
        <section class="banner-section">
            <div class="banner">
                <h2>دنیای کتاب‌های الکترونیکی و صوتی</h2>
                <p>هزاران کتاب را همیشه همراه خود داشته باشید.</p>
            </div>
        </section>

        <div id="home-rows-container"></div>
        <div id="search-view" style="display: none;">
            <div class="filters-bar">
                <div class="filter-group">
                    <label for="filter-category">دسته‌بندی:</label>
                    <select id="filter-category">
                        <option value="">همه دسته‌ها</option>
                        <option value="رمان">رمان</option>
                        <option value="شعر">شعر</option>
                        <option value="تاریخ">تاریخ</option>
                    </select>
                </div>
                <div class="filter-group checkbox-group">
                    <input type="checkbox" id="filter-free">
                    <label for="filter-free">فقط کتاب‌های رایگان</label>
                </div>
                <div class="filter-group">
                    <label for="sort-select">مرتب‌سازی:</label>
                    <select id="sort-select">
                        <option value="">پیش‌فرض</option>
                        <option value="price-asc">ارزان‌ترین</option>
                        <option value="price-desc">گران‌ترین</option>
                        <option value="rating-desc">بیشترین امتیاز</option>
                    </select>
                </div>
                <button id="clear-filters" class="btn-secondary">پاک کردن فیلترها</button>
            </div>
            
            <div class="search-info">
                <p id="results-count"></p>
            </div>

            <div id="search-results-container" class="books-grid"></div>
            
            <div id="no-results-message" class="empty-state" style="display: none;">
                <p>متأسفانه کتابی با این مشخصات یافت نشد.</p>
                <button id="back-to-list-btn" class="btn-primary">بازگشت به فهرست همه کتاب‌ها</button>
            </div>
        </div>
    </main>

    <script src="./js/book.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
