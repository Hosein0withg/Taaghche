<!doctype html>
<html lang="fa" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>طاقچه</title>
        <link rel="stylesheet" href="./css/style.css" />
    </head>
    <body>
        <header class="app-header">
            <div class="header-container">
                <h1 class="logo" id="home-logo" tabindex="0" role="button">
                    طاقچه
                </h1>
                <div class="search-box">
                    <label for="search-input" class="sr-only"
                        >جستجو در عنوان و نویسنده</label
                    >
                    <input
                        type="text"
                        id="search-input"
                        placeholder="جستجو در عنوان و نویسنده..."
                    />
                </div>
                <nav class="header-nav" aria-label="منوی اصلی">
                    <div class="nav-dropdown-wrapper">
                        <button
                            type="button"
                            id="categories-btn"
                            class="nav-link-btn"
                            aria-expanded="false"
                            aria-haspopup="true"
                        >
                            دسته‌ها ▾
                        </button>
                        <div
                            id="categories-dropdown"
                            class="categories-dropdown"
                            style="display: none"
                        ></div>
                    </div>
                    <a href="index.html?view=library" id="library-link"
                        >کتابخانه من</a
                    >
                    <div id="auth-header-area" class="auth-header-area">
                        <button
                            type="button"
                            id="auth-button"
                            class="btn-primary"
                        >
                            ورود / ثبت‌نام
                        </button>
                    </div>
                </nav>
            </div>
        </header>

        <main id="app">
            <section class="banner-section" id="banner-section">
                <div class="banner">
                    <h2>دنیای کتاب‌های الکترونیکی و صوتی</h2>
                    <p>هزاران کتاب را همیشه همراه خود داشته باشید.</p>
                </div>
            </section>

            <div id="home-rows-container"></div>

            <div id="search-view" style="display: none">
                <div class="filters-bar">
                    <div class="filter-group">
                        <label for="filter-category">دسته‌بندی:</label>
                        <select id="filter-category">
                            <option value="">همه دسته‌ها</option>
                        </select>
                    </div>
                    <div class="filter-group checkbox-group">
                        <input type="checkbox" id="filter-free" />
                        <label for="filter-free">فقط کتاب‌های رایگان</label>
                    </div>
                    <div class="filter-group">
                        <label for="sort-select">مرتب‌سازی:</label>
                        <select id="sort-select">
                            <option value="">پیش‌فرض</option>
                            <option value="price-asc">ارزان‌ترین</option>
                            <option value="price-desc">گران‌ترین</option>
                            <option value="rating-desc">بیشترین امتیاز</option>
                        </select>
                    </div>
                    <button
                        type="button"
                        id="clear-filters"
                        class="btn-secondary"
                    >
                        پاک کردن فیلترها
                    </button>
                </div>

                <div class="search-info">
                    <p id="results-count" aria-live="polite"></p>
                </div>

                <div id="search-results-container" class="books-grid"></div>

                <div
                    id="no-results-message"
                    class="empty-state"
                    style="display: none"
                >
                    <p>متأسفانه کتابی با این مشخصات یافت نشد.</p>
                    <button
                        type="button"
                        id="back-to-list-btn"
                        class="btn-primary"
                    >
                        بازگشت به فهرست همه کتاب‌ها
                    </button>
                </div>
            </div>

            <div id="book-details-view" style="display: none"></div>

            <div id="library-view" style="display: none"></div>

            <section
                id="reader-view"
                class="reader-view"
                style="display: none"
                aria-label="صفحه کتابخوان"
            >
                <div class="reader-toolbar">
                    <div class="reader-title-group">
                        <span
                            id="reader-mode-badge"
                            class="reader-badge"
                        ></span>
                        <h2
                            id="reader-book-title"
                            class="reader-book-title"
                        ></h2>
                    </div>
                    <div class="reader-controls">
                        <div
                            class="reader-control-group"
                            role="group"
                            aria-label="اندازه قلم"
                        >
                            <button
                                type="button"
                                class="reader-ctrl-btn"
                                data-font-size="small"
                            >
                                قلم کوچک
                            </button>
                            <button
                                type="button"
                                class="reader-ctrl-btn"
                                data-font-size="medium"
                            >
                                قلم متوسط
                            </button>
                            <button
                                type="button"
                                class="reader-ctrl-btn"
                                data-font-size="large"
                            >
                                قلم بزرگ
                            </button>
                        </div>
                        <button
                            type="button"
                            id="reader-theme-btn"
                            class="reader-ctrl-btn"
                        >
                            تم تیره
                        </button>
                        <button
                            type="button"
                            id="reader-exit-btn"
                            class="btn-secondary"
                        >
                            خروج از کتابخوان
                        </button>
                    </div>
                </div>
                <article id="reader-content-box" class="reader-content-box">
                    <div id="reader-text-body" class="reader-text-body"></div>
                </article>
            </section>

            <div
                id="auth-modal"
                class="modal-backdrop"
                role="dialog"
                aria-modal="true"
                aria-labelledby="auth-modal-title"
                style="display: none"
            >
                <div class="modal-content auth-modal-content">
                    <div class="modal-header">
                        <h3 id="auth-modal-title">ورود به حساب کاربری</h3>
                        <button
                            type="button"
                            id="close-auth-btn"
                            class="btn-secondary"
                        >
                            بستن
                        </button>
                    </div>
                    <form id="auth-form" class="auth-form" novalidate>
                        <p
                            id="auth-login-hint"
                            class="auth-hint"
                            style="display: none"
                        >
                            برای دریافت کتاب یا افزودن به علاقه‌مندی‌ها ابتدا
                            وارد حساب کاربری خود شوید.
                        </p>
                        <div class="form-field">
                            <label for="auth-name">نام کاربری</label>
                            <input type="text" id="auth-name" />
                            <span
                                id="auth-name-error"
                                class="field-error"
                                aria-live="polite"
                            ></span>
                        </div>
                        <div class="form-field">
                            <label for="auth-phone">شماره موبایل</label>
                            <input type="text" id="auth-phone" dir="ltr" />
                            <span
                                id="auth-phone-error"
                                class="field-error"
                                aria-live="polite"
                            ></span>
                        </div>
                        <button
                            type="submit"
                            class="btn-primary auth-submit-btn"
                        >
                            ورود
                        </button>
                    </form>
                </div>
            </div>
        </main>

        <script src="./js/book.js"></script>
        <script src="./js/storage.js"></script>
        <script src="./js/ui.js"></script>
        <script src="./js/app.js"></script>
    </body>
</html>
